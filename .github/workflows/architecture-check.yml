name: Architecture Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-typecheck:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck architecture foundation
        run: npx tsc -p tsconfig.architecture.json

      - name: Build application
        run: npm run build
