name: Backend finalization codemod

on:
  push:
    branches:
      - security/backend-finalization
    paths:
      - scripts/backend-finalization-codemod.mjs
      - .github/workflows/backend-finalization-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/backend-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply deterministic codemod
        run: node scripts/backend-finalization-codemod.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "ponto-g-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/EditProfileModal.tsx components/Onboarding.tsx components/VenueDetailModal.tsx
          git commit -m "refactor(security): migrate profile consumers to contracts"
          git push origin HEAD:security/backend-finalization
