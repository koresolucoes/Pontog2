name: Profile embeds cutover

on:
  push:
    branches:
      - security/backend-finalization
    paths:
      - .github/workflows/profile-embeds-cutover-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/backend-finalization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace wildcard embedded profiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('stores/eventStore.ts'),
              Path('stores/inboxStore.ts'),
              Path('stores/communityStore.ts'),
              Path('components/CommunityPostDetailModal.tsx'),
          ]
          safe = 'id,username,display_name,avatar_url,public_photos,video_url,status_text,last_seen,subscription_tier,is_verified,has_private_albums'
          for path in files:
              text = path.read_text()
              text = text.replace('profiles(*)', f'profiles({safe})')
              text = text.replace('profiles!inner(*)', f'profiles!inner({safe})')
              text = text.replace('profiles!user_connections_follower_id_fkey(*)', f'profiles!user_connections_follower_id_fkey({safe})')
              text = text.replace('profiles!user_connections_following_id_fkey(*)', f'profiles!user_connections_following_id_fkey({safe})')
              text = text.replace('profiles!community_posts_author_id_fkey(*)', f'profiles!community_posts_author_id_fkey({safe})')
              text = text.replace('profiles!community_members_user_id_fkey(*)', f'profiles!community_members_user_id_fkey({safe})')
              text = text.replace('profiles!community_comments_author_id_fkey(*)', f'profiles!community_comments_author_id_fkey({safe})')
              path.write_text(text)
          PY
      - run: npm ci
      - run: npx tsc -p tsconfig.architecture.json
      - run: npm run build
      - name: Assert no embedded wildcard profile joins remain
        shell: bash
        run: |
          if grep -R -n -E 'profiles(![A-Za-z0-9_]+)?\(\*\)' stores components --include='*.ts' --include='*.tsx'; then
            echo 'Embedded profile wildcard remains.' >&2
            exit 1
          fi
      - name: Commit migrated source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ponto-g-security-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stores/eventStore.ts stores/inboxStore.ts stores/communityStore.ts components/CommunityPostDetailModal.tsx
          git commit -m 'refactor(security): use safe embedded profile projections'
          git push origin HEAD:security/backend-finalization
