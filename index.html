  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#020203', // Almost black
              900: '#050505', // OLED Black
              800: '#0A0A0C',
              700: '#121214',
            },
            primary: {
              500: '#F50C69', // Nocturnal Pulse Pink
              600: '#D40A5B',
            },
            secondary: {
              500: '#810DF7', // Nocturnal Pulse Purple
              600: '#6A0BC7',
            },
            tertiary: {
              500: '#27AE60', // Nocturnal Pulse Green
              600: '#219653',
            }
          },
          fontFamily: {
            syne: ['"Bricolage Grotesque"', 'sans-serif'],
            space: ['"Space Grotesk"', 'sans-serif'],
            outfit: ['"DM Sans"', 'sans-serif'],
            inter: ['"DM Sans"', 'sans-serif'],
            sans: ['"DM Sans"', 'sans-serif'],
            bricolage: ['"Bricolage Grotesque"', 'sans-serif'],
            dm: ['"DM Sans"', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-fire': 'pulse-fire 2s infinite',
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            'slide-in-up': 'slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'radar-spin': 'radarSpin 3s linear infinite',
            'spin-slow': 'spin 3s linear infinite',
            'spin-reverse': 'spinReverse 4s linear infinite',
            'spin-reverse-slow': 'spinReverse 8s linear infinite',
            'ping-slow': 'pingSlow 3s cubic-bezier(0, 0, 0.2, 1) infinite',
            'ripple': 'ripple 3s cubic-bezier(0, 0.2, 0.8, 1) infinite',
            'blob': 'blob 10s infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            'pulse-fire': {
              '0%': { boxShadow: '0 0 0 0 rgba(245, 12, 105, 0.7)' },
              '70%': { boxShadow: '0 0 0 10px rgba(245, 12, 105, 0)' },
              '100%': { boxShadow: '0 0 0 0 rgba(245, 12, 105, 0)' },
            },
            fadeIn: {
                'from': { opacity: '0' },
                'to': { opacity: '1' }
            },
            fadeInUp: {
                'from': { opacity: '0', transform: 'translateY(20px)' },
                'to': { opacity: '1', transform: 'translateY(0)' }
            },
            slideInUp: {
                'from': { transform: 'translateY(100%)', opacity: '0' },
                'to': { transform: 'translateY(0)', opacity: '1' }
            },
            radarSpin: {
                'from': { transform: 'rotate(0deg)' },
                'to': { transform: 'rotate(360deg)' }
            },
            spinReverse: {
                'from': { transform: 'rotate(360deg)' },
                'to': { transform: 'rotate(0deg)' }
            },
            pingSlow: {
                '75%, 100%': { transform: 'scale(2)', opacity: '0' }
            },
            ripple: {
                '0%': { top: '50%', left: '50%', width: '0', height: '0', opacity: '1' },
                '100%': { top: '0', left: '0', width: '100%', height: '100%', opacity: '0' }
            },
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <style>
    /* Basic reset and body styling */
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif; /* Body font */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #050505;
      color: #f8fafc;
      overflow-x: hidden;
      /* Safe area for mobile navigation bar */
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    h1, h2, h3, h4, h5, h6 {
        font-family: 'Bricolage Grotesque', sans-serif; /* LGBT expressive Headings font */
        letter-spacing: -0.02em;
    }
    
    .font-syne, .font-space {
        font-family: 'Bricolage Grotesque', sans-serif !important;
    }

    /* Make icons more bold and distinct */
    .material-symbols-rounded {
      font-variation-settings:
      'FILL' 1,
      'wght' 500,
      'GRAD' 0,
      'opsz' 24;
      display: inline-block;
      transition: all 0.2s ease;
    }
    
    /* Glassmorphism Utilities - Premium */
    .glass-panel {
        background: rgba(20, 20, 25, 0.75);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Google Material Symbols default style */
    .material-symbols-rounded {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24;
      user-select: none; /* Prevents text selection of icons */
    }
    .material-symbols-rounded.filled {
      font-variation-settings: 'FILL' 1;
    }

    /* Leaflet popup customization */
    .leaflet-popup-content-wrapper {
        background: rgba(10, 10, 12, 0.9);
        backdrop-filter: blur(12px);
        color: #f8fafc;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        padding: 0;
    }
    .leaflet-popup-content {
        margin: 12px 16px;
        line-height: 1.5;
        font-family: 'Outfit', sans-serif;
    }
    .leaflet-popup-tip {
        background: rgba(10, 10, 12, 0.9);
    }
    
    /* Modern Scrollbar - Slim & Dark */
    ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
    }
    
    /* Utility for hiding scrollbar but allowing scroll */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    /* Mask Image utilities for fade out lists */
    .mask-image-b {
        mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
    }

    .mask-fade-edges {
        mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
    }

    .mask-fade-edges-vertical {
        mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    }

    .animate-marquee {
        animation: marquee 10s linear infinite;
        display: inline-block;
        white-space: nowrap;
    }

    @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
    }
  </style>
